name: Windows checks and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run dist
      - run: npm run bundle
      - uses: actions/upload-artifact@v4
        with:
          name: DeskCue-windows-x64
          path: |
            dist/DeskCue-*-windows-x64.exe
            dist/DeskCue-*-windows-x64.zip
            dist/SHA256SUMS.txt
