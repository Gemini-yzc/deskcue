name: Publish verified Windows release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Windows CI run ID in this repository
        required: true
        type: string
      tag_name:
        description: Release tag, for example v0.1.0
        required: true
        type: string
      draft_release_id:
        description: Existing draft release ID when resuming publication
        required: false
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      TAG_NAME: ${{ inputs.tag_name }}
      DRAFT_RELEASE_ID: ${{ inputs.draft_release_id }}
    steps:
      - name: Validate build and release inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ -z "$DRAFT_RELEASE_ID" || "$DRAFT_RELEASE_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$REPO/actions/runs/$BUILD_RUN_ID" > "$RUNNER_TEMP/build.json"
          jq -e --arg repo "$REPO" '.conclusion == "success" and .head_repository.full_name == $repo and .name == "Windows checks and package"' "$RUNNER_TEMP/build.json"
          echo "BUILD_SHA=$(jq -r .head_sha "$RUNNER_TEMP/build.json")" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: DeskCue-windows-x64
          path: release-files
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
      - name: Verify checksums and exclude personal data
        shell: bash
        working-directory: release-files
        run: |
          set -euo pipefail
          EXE="DeskCue-${TAG_NAME#v}-windows-x64.exe"
          ZIP="DeskCue-${TAG_NAME#v}-windows-x64.zip"
          export EXE ZIP
          sha256sum -c SHA256SUMS.txt
          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const expected = [process.env.EXE, process.env.ZIP, 'SHA256SUMS.txt'].sort();
          if (JSON.stringify(fs.readdirSync('.').sort()) !== JSON.stringify(expected)) throw new Error('Unexpected release artifact files');
          const entries = cp.execFileSync('unzip', ['-Z1', process.env.ZIP], { encoding: 'utf8' }).trim().split(/\r?\n/);
          const allowed = new Set([process.env.EXE, 'CONTRIBUTING.md', 'LICENSE', 'README.md', 'SECURITY.md', 'THIRD_PARTY_NOTICES.md', '使用说明.txt', 'docs/images/panel.png']);
          if (entries.length !== allowed.size || entries.some(entry => !allowed.has(entry))) throw new Error('ZIP contains unexpected files or personal data');
          const crypto = require('node:crypto');
          const embedded = cp.execFileSync('unzip', ['-p', process.env.ZIP, process.env.EXE], { maxBuffer: 200 * 1024 * 1024 });
          const hash = value => crypto.createHash('sha256').update(value).digest('hex');
          if (hash(embedded) !== hash(fs.readFileSync(process.env.EXE))) throw new Error('ZIP and standalone EXE differ');
          console.log('Verified explicit file allowlist, no data, matching EXE, and SHA256 checksums');
          NODE
      - name: Upload assets and publish
        shell: bash
        working-directory: release-files
        run: |
          set -euo pipefail
          RELEASES="repos/$REPO/releases"
          NOTES="$RUNNER_TEMP/release-notes.md"
          gh api "repos/$REPO/contents/docs/releases/$TAG_NAME.md?ref=$BUILD_SHA" --jq '.content' | base64 -d > "$NOTES"
          test -s "$NOTES"
          if [ -n "$DRAFT_RELEASE_ID" ]; then
            gh api "$RELEASES/$DRAFT_RELEASE_ID" > "$RUNNER_TEMP/release.json"
          else
            gh api --method POST "$RELEASES" -f tag_name="$TAG_NAME" -f target_commitish="$BUILD_SHA" \
              -f name="DeskCue $TAG_NAME · Windows Portable" -F draft=true -F "body=@$NOTES" > "$RUNNER_TEMP/release.json"
          fi
          jq -e --arg tag "$TAG_NAME" --arg sha "$BUILD_SHA" \
            '.draft and .tag_name == $tag and .target_commitish == $sha' "$RUNNER_TEMP/release.json"
          RELEASE_ID=$(jq -er '.id' "$RUNNER_TEMP/release.json")
          UPLOAD_URL=$(jq -er '.upload_url | split("{")[0]' "$RUNNER_TEMP/release.json")
          [[ "$UPLOAD_URL" == "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets" ]]
          ASSETS="$RUNNER_TEMP/release-assets.json"
          gh api "$RELEASES/$RELEASE_ID/assets" > "$ASSETS"
          for FILE in "DeskCue-${TAG_NAME#v}-windows-x64.exe" "DeskCue-${TAG_NAME#v}-windows-x64.zip" SHA256SUMS.txt; do
            DIGEST="sha256:$(sha256sum "$FILE" | cut -d' ' -f1)"
            BYTES=$(wc -c < "$FILE" | tr -d ' ')
            if jq -e --arg name "$FILE" '.[] | select(.name == $name)' "$ASSETS" > /dev/null; then
              jq -e --arg name "$FILE" --arg digest "$DIGEST" --argjson bytes "$BYTES" \
                '.[] | select(.name == $name and .state == "uploaded" and .size == $bytes and .digest == $digest)' "$ASSETS" > /dev/null
            else
              curl --fail-with-body --silent --show-error \
                -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" \
                --data-binary "@$FILE" "$UPLOAD_URL?name=$FILE" |
                jq -e --arg name "$FILE" --argjson bytes "$BYTES" '.name == $name and .state == "uploaded" and .size == $bytes'
            fi
          done
          gh api "$RELEASES/$RELEASE_ID/assets" --jq 'map(select(.state == "uploaded") | .name) | sort' > "$ASSETS"
          jq -e --arg exe "DeskCue-${TAG_NAME#v}-windows-x64.exe" --arg zip "DeskCue-${TAG_NAME#v}-windows-x64.zip" \
            '. == ([$exe, $zip, "SHA256SUMS.txt"] | sort)' "$ASSETS"
          gh api --method PATCH "$RELEASES/$RELEASE_ID" -F draft=false -f make_latest=true -F "body=@$NOTES" --jq '.html_url'
