<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:"
    />
    <title>Stikly – My notes</title>
    <link rel="stylesheet" href="library.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <img src="../build/icon.png" alt="" class="brand-badge" />
          Stikly
        </div>
        <button type="button" id="updateBtn" class="update-btn" hidden>
          ⬆ New version available
        </button>
        <div class="theme-switch" role="group" aria-label="Theme">
          <button
            type="button"
            data-pref="system"
            title="Auto (follows Windows)"
          >
            Auto
          </button>
          <button type="button" data-pref="light" title="Light">☀</button>
          <button type="button" data-pref="dark" title="Dark">☾</button>
        </div>
      </div>
    </header>

    <main class="wrap">
      <section class="hero">
        <div class="hero-eyebrow">Your notice board</div>
        <h1>My notes</h1>
        <p class="lede" id="countLabel">&nbsp;</p>

        <div class="hero-actions">
          <button type="button" id="newBtn" class="paper-btn primary">
            + New note
          </button>
          <button type="button" id="importBtn" class="paper-btn secondary">
            Import…
          </button>
          <button type="button" id="folderBtn" class="paper-btn secondary">
            Open folder
          </button>
        </div>

        <input
          type="search"
          id="searchInput"
          class="search"
          placeholder="Search your notes…"
          spellcheck="false"
        />
      </section>

      <section id="board" class="board" aria-label="Saved notes"></section>
      <p id="emptyState" class="empty"></p>
      <p class="hint">
        Click a note to open it · Shift + click to open it without closing this
        panel
      </p>
      <label class="update-opt">
        <input type="checkbox" id="updateOpt" /> Notify me about new versions
      </label>
    </main>

    <div id="updateModal" class="modal" hidden>
      <div
        class="modal-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="updateTitle"
      >
        <h2 id="updateTitle"></h2>
        <div id="updateBody" class="md"></div>
        <div class="modal-actions">
          <button type="button" id="updateClose" class="paper-btn secondary">
            Later
          </button>
          <button type="button" id="updateDownload" class="paper-btn primary">
            Go to download page
          </button>
        </div>
      </div>
    </div>

    <script src="library.js"></script>
  </body>
</html>
